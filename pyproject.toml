[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dnscheck"
version = "1.3.0"
description = "Zero-dependency DNS leak detector (Interactsh OAST), transparent hijack auditor, split-routing verifier, WebRTC/STUN probe & AI region checker (CLI + Web UI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "DNSGuard Contributors" }
]
keywords = [
  "dns",
  "dns-leak",
  "interactsh",
  "oast",
  "clash",
  "mihomo",
  "surge",
  "sing-box",
  "doh",
  "dot",
  "stun",
  "webrtc",
  "network-diagnostics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yunfan777/dns-leak-guard"
Repository = "https://github.com/yunfan777/dns-leak-guard"
Issues = "https://github.com/yunfan777/dns-leak-guard/issues"

[project.scripts]
dnscheck = "dnscheck.cli.commands:main"

[tool.setuptools.packages.find]
include = ["dnscheck*"]

[tool.setuptools.package-data]
"dnscheck.web" = ["static/*"]
